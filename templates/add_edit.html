{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'Add' }} Task - Study Planner{% endblock %}
{% block content %}

<div class="card">
  <h2 style="margin-top:0;">{{ 'Edit Task' if mode == 'edit' else 'Add New Task' }}</h2>
  <form class="stack" method="post"
        action="{{ url_for('edit_task', task_id=task_id) if mode == 'edit' else url_for('add_task') }}">

    <div class="field">
      <label for="subject">Subject / Task name</label>
      <input type="text" id="subject" name="subject" value="{{ subject or '' }}" required>
    </div>

    <div class="field">
      <label for="duration">Duration (minutes)</label>
      <input type="number" id="duration" name="duration" value="{{ duration or '' }}" min="1" max="1440" required>
    </div>

    <div class="field">
      <label for="priority">Priority</label>
      <select id="priority" name="priority" required>
        <option value="">Select priority</option>
        <option value="High" {% if priority == 'High' %}selected{% endif %}>High</option>
        <option value="Medium" {% if priority == 'Medium' %}selected{% endif %}>Medium</option>
        <option value="Low" {% if priority == 'Low' %}selected{% endif %}>Low</option>
      </select>
    </div>

    <div class="field">
      <label for="due_date">Due date</label>
      <input type="date" id="due_date" name="due_date" value="{{ due_date or '' }}" required>
    </div>

    <div class="form-actions">
      <button class="btn" type="submit">{{ 'Save Changes' if mode == 'edit' else 'Add Task' }}</button>
      <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
